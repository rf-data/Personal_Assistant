name: C27 Stage-0

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the actual PR head with base history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate the Stage-0 candidate without package installation
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -I -S -B ci/c27-stage0/validate.py --root . --expected-head "$EXPECTED_PR_HEAD"
      - name: Test rejection of modified candidate inputs
        run: python -I -S -B -m unittest discover -s ci/c27-stage0/tests -v
