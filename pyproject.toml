[project]
name = "gmp-compliance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "typer>=0.25.1",
]

[project.optional-dependencies]

lecture-worker = [
    "yt-dlp>=2026.7.4",
    "bgutil-ytdlp-pot-provider>=2.0.2",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    "pydub>=0.25.1",
]

nlp = [
    "sentence-transformers>=5.0",
    "spacy>=3.8.14",
    "torch>=2.13.0",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
]

vision = [
    "imagehash>=4.3.2",
    "opencv-python>=4",
    "pymupdf>=1.27.2.2",
]

ocr = [
    "docling[rapidocr]>=2.129.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

rag = [
    "chromadb>=1.5.9",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.0",
]

frontend = [
    "streamlit[pdf]>=1.56.0",
    "streamlit-pdf-viewer>=0.0.29",
    "pandas>=3.0.2",
    "matplotlib>=3.10.9",
]

llm = [
    "instructor>=1.15.4",
    "langfuse>=4.14.1",
    "litellm>=1.93.0",
    "marvin>=3.2.7",
    "openai>=2.44.0",
    "pydantic-ai>=1.9,<1.20",
    "tiktoken>=0.12.0",
]

monitoring = [
    "mlflow>=1.27.0",
    "opentelemetry-api<1.44",
    "opentelemetry-sdk<1.44",
    "langfuse>=4.14.1",
]

documents = [
    "bs4>=0.0.2",
    "defusedxml>=0.7.1",
    "docling[rapidocr]>=2.129.0",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "markdown>=3.10.2",
]


[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
    "pytest>=9.0.3",
    "detect-secrets>=1.5.0",
]

unclear = [
    "markdown-it-py>=4.0.0",
]


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

extend-exclude = [
    "data",
    "logs",
    "cache",
    "chroma",
    "mlflow",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
        "E",    # pycodestyle-Fehler
        "F",    # Pyflakes
        "I",    # Import-Sortierung
        "UP",   # pyupgrade
        "B",    # flake8-bugbear
        ]

ignore = [
        "E501",
        "SIM103",
        "SIM105",
        "SIM108",
        ]
fixable = ["ALL"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [
    "^src/_dev_to_add/",
]
explicit_package_bases = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "data",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
