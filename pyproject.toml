[project]
name = "gmp-compliance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "defusedxml>=0.7.1",
    "docx>=0.2.4",
    "fastapi>=0.136.1",
    "faster-whisper>=1.2.1",
    "ffmpeg>=1.4",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "json5>=0.14.0",
    "markdown>=3.10.2",
    "markdown-it-py>=4.0.0",
    "marvin>=3.2.7",
    "matplotlib>=3.10.9",
    "mlflow>=1.27.0",
    "numpy>=2.4.4",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.3",
    "pydantic-ai>=1.9,<1.20",
    "pydub>=0.25.1",
    "pyinputplus>=0.2.12",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "returns>=0.27.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=5.0",
    "sounddevice>=0.5.5",
    "spacy>=3.8.14",
    "streamlit-pdf-viewer>=0.0.29",
    "streamlit[pdf]>=1.56.0",
    "tiktoken>=0.12.0",
    "torch>=2.13.0",
    "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
    "pytest>=9.0.3",
]

nlp = [
    "sentence-transformers>=2.2.2",
    "spacy>=3.8.14",
]



[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
