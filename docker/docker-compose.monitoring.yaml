# Local development. Preserve project name and all existing data paths.
# Required digests must match already approved images; no implicit upgrades.
# Portainer socket grants host control even with cap_drop. Its image has no verified HTTP probe binary.
# cAdvisor host binds remain sensitive. Verify probe binaries for each selected digest.
services:
  alert_manager:
    restart: unless-stopped
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    tmpfs: &id003
    - /tmp:rw,noexec,nosuid,size=32m
    logging: &id004
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks: &id005
    - monitoring
    container_name: alertmanager
    image: prom/alertmanager@sha256:${ALERTMANAGER_DIGEST:?Set approved 64 hex digest}
    user: 65534:65534
    ports:
    - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    volumes:
    - ../monitoring/alertmanager/config:/etc/alertmanager:ro
    - type: bind
      source: ../monitoring/alertmanager/data
      target: /alertmanager
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9093/-/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
    - --config.file=/etc/alertmanager/alertmanager.yaml
    - --cluster.listen-address=
  cAdvisor:
    restart: unless-stopped
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    tmpfs: *id003
    logging: *id004
    networks: *id005
    container_name: c_advisor
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    user: 0:0
    ports:
    - 127.0.0.1:${CADVISOR_PORT:-8080}:8080
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles:
    - containers
    privileged: false
    command:
    - --housekeeping_interval=30s
    - --store_container_labels=false
  grafana:
    restart: unless-stopped
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    cpus: 1.0
    mem_limit: 512m
    tmpfs: *id003
    logging: *id004
    networks: *id005
    container_name: grafana
    image: grafana/grafana:12.1.0
    user: '472:0'
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    volumes:
    - type: bind
      source: ../monitoring/grafana/data
      target: /var/lib/grafana
      bind:
        create_host_path: false
    - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '3'
      - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_LOG_MODE: console
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
    - grafana_admin_password
  node-exporter:
    restart: unless-stopped
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    tmpfs: *id003
    logging: *id004
    networks: *id005
    container_name: node-exporter
    image: prom/node-exporter@sha256:${NODE_EXPORTER_DIGEST:?Set approved 64 hex digest}
    user: 65534:65534
    ports:
    - 127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9100/metrics
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles:
    - host
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/run/docker/netns/.+)$
  portainer:
    restart: unless-stopped
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
    tmpfs: *id003
    logging: *id004
    networks: *id005
    container_name: portainer
    image: portainer/portainer-ce@sha256:${PORTAINER_DIGEST:?Set approved 64 hex digest}
    user: 0:0
    ports:
    - 127.0.0.1:${PORTAINER_PORT:-9443}:9443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - type: bind
      source: ../monitoring/portainer/data
      target: /data
      bind:
        create_host_path: false
    healthcheck:
      disable: true
    profiles:
    - admin
  prometheus:
    restart: unless-stopped
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 128
    cpus: 2.0
    mem_limit: 1g
    tmpfs: *id003
    logging: *id004
    networks: *id005
    container_name: prometheus
    image: prom/prometheus:v3.5.0
    user: 65534:65534
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
    - ../monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
    - ../monitoring/prometheus/targets:/etc/prometheus/targets:ro
    - type: bind
      source: ../monitoring/prometheus/data
      target: /prometheus
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9090/-/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
    - --config.file=/etc/prometheus/prometheus.yaml
    - --storage.tsdb.path=/prometheus
networks:
  monitoring:
    internal: true
secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?Set an external file; never commit its contents}
