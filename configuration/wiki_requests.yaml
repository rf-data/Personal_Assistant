article_parsing: 
  language: en        # Literal["en", "de"]
  max_retries: 3
  header_agent: 'GMPComplianceBot/0.1 (private educational project; User: nirvana941@gmx.net)'
  header_referer: https://en.wikipedia.org/
  header_accept: image/svg+xml,image/*,*/*
  
  article_to_parse:
    # - 1208
  llm_model: gpt-4o-mini
  scrape_images: True
  parser: html.parser
  extraction_tags:
  - h1
  - h2
  - h3
  - p
  - ul
  - ol
  - pre
  - table
  - img
