# WIKIPEDIA_QUERIES
wiki:
  parser: html.parser
  query: Partial_least # turing
  query_time: 2026-05-18_13-08-12
  article_to_parse:
    - 314204
  language: en        # Literal["en", "de"]
  max_retries: 3
  assemble_as_md: True
  # scrape_images: True
  save:
    - info
    - html
    - md

# PDF
pdf:
  extract_source:
      - raw_dict
      - words
  extraction_model: pymupdf

  extract_text_info: True
  extract_grafics: False

  assemble_as_md: True
  percentiles:
    - 0.01
    - 0.05
    - 0.10
    - 0.25
    - 0.50
    - 0.75
    - 0.90
    - 0.95
